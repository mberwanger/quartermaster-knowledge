name: quartermaster-knowledge
schema: meta/frontmatter.schema.json
packages: meta/packages.yaml

# The bundle source is the repository root. Documents are included from the
# knowledge and capability roots rather than swept up with **/*.md, because
# README.md and other repository files are not bundle content.
#
# include decides what is a document at all, which is what gets validated.
# exclude decides what travels in the bundle. They are not the same question.
include:
  - "knowledge/**/*.md"
  - "capabilities/skills/**/*.md"
  - "capabilities/agents/**/*.md"

# What a document must be before a package may turn it into a rule. A draft is
# still distributed and still readable; it just never loads on its own.
requires:
  status: [stable]
  visibility: { not: [restricted] }

# What counts as a skill: a directory whose skill.md declares type skill. The
# files beside it travel as assets and need no frontmatter of their own.
skills:
  type: [skill]
